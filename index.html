<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#1a1a1a" />
  <title>Northmen Inventory</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1c1c1e;
      --surface2: #2c2c2e;
      --surface3: #3a3a3c;
      --gold: #d4a017;
      --gold-light: #f0bc2e;
      --red: #ff453a;
      --red-soft: #3d1a18;
      --green: #30d158;
      --text: #f5f5f7;
      --text2: #aeaeb2;
      --text3: #636366;
      --border: #38383a;
      --radius: 12px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overscroll-behavior: none;
    }

    /* ── LOCK SCREEN ── */
    #lock-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      z-index: 999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 32px;
    }
    #lock-screen.hidden { display: none; }
    .lock-logo {
      width: 72px; height: 72px;
      background: var(--gold);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 38px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(212,160,23,0.3);
    }
    .lock-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
    }
    .lock-sub {
      font-size: 14px;
      color: var(--text2);
      margin-bottom: 40px;
    }
    .pin-dots {
      display: flex;
      gap: 16px;
      margin-bottom: 36px;
    }
    .pin-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      border: 2px solid var(--text3);
      background: transparent;
      transition: all 0.15s;
    }
    .pin-dot.filled {
      background: var(--gold);
      border-color: var(--gold);
    }
    .pin-dot.error {
      background: var(--red);
      border-color: var(--red);
    }
    .pin-keypad {
      display: grid;
      grid-template-columns: repeat(3, 72px);
      gap: 14px;
    }
    .pin-key {
      width: 72px; height: 72px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 50%;
      color: var(--text);
      font-size: 22px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.1s;
      display: flex; align-items: center; justify-content: center;
    }
    .pin-key:active { background: var(--surface3); transform: scale(0.93); }
    .pin-key.del { font-size: 18px; color: var(--text2); }
    .pin-key.empty { background: transparent; border: none; cursor: default; }
    .lock-error {
      margin-top: 20px;
      color: var(--red);
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
      text-align: center;
    }

    /* ── TOP BAR ── */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15,15,15,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 10px;
    }
    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: 600px;
      margin: 0 auto;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 32px; height: 32px;
      background: var(--gold);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .logo-text {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .logo-sub {
      font-size: 11px;
      color: var(--text2);
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .mode-toggle {
      display: flex;
      background: var(--surface2);
      border-radius: 8px;
      padding: 2px;
      gap: 2px;
    }
    .mode-btn {
      border: none;
      background: transparent;
      color: var(--text2);
      font-size: 12px;
      font-weight: 600;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .mode-btn.active {
      background: var(--gold);
      color: #000;
    }

    /* ── SCREENS ── */
    .screen { display: none; }
    .screen.active { display: block; }
    .inner { max-width: 600px; margin: 0 auto; padding: 16px; }

    /* ── REORDER ALERT BANNER ── */
    .reorder-banner {
      background: var(--red-soft);
      border: 1px solid var(--red);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 20px;
    }
    .reorder-banner-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .reorder-banner-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: var(--red);
    }
    .badge {
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 20px;
    }
    .reorder-item {
      background: rgba(255,69,58,0.08);
      border: 1px solid rgba(255,69,58,0.25);
      border-radius: 8px;
      padding: 10px 12px;
      margin-bottom: 8px;
    }
    .reorder-item:last-child { margin-bottom: 0; }
    .reorder-item-name {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }
    .reorder-item-meta {
      font-size: 12px;
      color: var(--text2);
      margin-top: 3px;
    }
    .reorder-item-location {
      font-size: 11px;
      color: var(--red);
      font-weight: 600;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .reorder-item-footer {
      margin-top: 10px;
      display: flex;
      justify-content: flex-end;
    }
    .done-btn {
      background: var(--green);
      color: #000;
      font-size: 13px;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      padding: 7px 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .done-btn:active { opacity: 0.8; }

    /* ── SECTION HEADER ── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin: 20px 0 10px;
    }

    /* ── LOCATION CARDS ── */
    .location-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 8px;
    }
    .location-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 16px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
    }
    .location-card:active { transform: scale(0.97); }
    .location-card .loc-icon { font-size: 32px; margin-bottom: 8px; }
    .location-card .loc-name {
      font-size: 15px;
      font-weight: 700;
    }
    .location-card .loc-count {
      font-size: 12px;
      color: var(--text2);
      margin-top: 3px;
    }
    .location-card.has-reorder {
      border-color: rgba(255,69,58,0.4);
    }
    .location-card .loc-alert {
      display: inline-block;
      background: var(--red);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 10px;
      margin-top: 6px;
    }

    /* ── CATEGORY LIST ── */
    .back-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      background: none;
      border: none;
      color: var(--gold);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      padding: 0;
      margin-bottom: 16px;
    }
    .page-title {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 4px;
      letter-spacing: -0.5px;
    }
    .page-sub {
      font-size: 13px;
      color: var(--text2);
      margin-bottom: 16px;
    }

    .cat-list { display: flex; flex-direction: column; gap: 8px; }
    .cat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.15s;
    }
    .cat-card:active { transform: scale(0.98); }
    .cat-card-left { display: flex; align-items: center; gap: 12px; }
    .cat-icon {
      width: 38px; height: 38px;
      background: var(--surface2);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
    }
    .cat-name { font-size: 15px; font-weight: 600; }
    .cat-count { font-size: 12px; color: var(--text2); margin-top: 2px; }
    .cat-right { display: flex; align-items: center; gap: 8px; }
    .cat-reorder-badge {
      background: var(--red);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 10px;
    }
    .chevron { color: var(--text3); font-size: 18px; }

    /* ── ITEM LIST ── */
    .item-list { display: flex; flex-direction: column; gap: 10px; }
    .item-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .item-card.reorder-flagged {
      border-color: var(--red);
    }
    .item-header {
      padding: 12px 14px 10px;
    }
    .item-name { font-size: 15px; font-weight: 700; }
    .item-detail { font-size: 12px; color: var(--text2); margin-top: 3px; }
    .item-actions {
      display: flex;
      border-top: 1px solid var(--border);
    }
    .item-qty-section {
      flex: 1;
      padding: 10px 14px;
      border-right: 1px solid var(--border);
    }
    .item-qty-label {
      font-size: 10px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .qty-btn {
      width: 28px; height: 28px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      line-height: 1;
    }
    .qty-display {
      font-size: 15px;
      font-weight: 700;
      min-width: 60px;
      text-align: center;
    }
    .qty-unit { font-size: 11px; color: var(--text2); }
    .item-reorder-section {
      padding: 10px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      min-width: 90px;
    }
    .item-reorder-label {
      font-size: 10px;
      color: var(--text3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .reorder-toggle {
      width: 48px; height: 28px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      position: relative;
      transition: background 0.2s;
      background: var(--surface3);
    }
    .reorder-toggle.on { background: var(--red); }
    .reorder-toggle::after {
      content: '';
      position: absolute;
      width: 22px; height: 22px;
      border-radius: 50%;
      background: #fff;
      top: 3px; left: 3px;
      transition: transform 0.2s;
    }
    .reorder-toggle.on::after { transform: translateX(20px); }
    .reorder-toggle-text {
      font-size: 10px;
      font-weight: 700;
      color: var(--text2);
    }
    .reorder-toggle.on + .reorder-toggle-text { color: var(--red); }

    /* ── OWNER INVENTORY BROWSE ── */
    .owner-browse .item-card { cursor: default; }
    .item-qty-readonly {
      padding: 10px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .qty-label-ro { font-size: 11px; color: var(--text2); }
    .qty-val-ro { font-size: 14px; font-weight: 700; }
    .reorder-chip {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 10px;
      background: var(--red);
      color: #fff;
    }
    .reorder-chip.no {
      background: var(--surface2);
      color: var(--text2);
    }

    /* ── ADD ITEM ── */
    .add-btn {
      position: fixed;
      bottom: 24px;
      right: 20px;
      width: 52px; height: 52px;
      background: var(--gold);
      border: none;
      border-radius: 50%;
      font-size: 26px;
      color: #000;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 20px rgba(212,160,23,0.4);
      z-index: 50;
    }

    /* ── MODAL ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: flex-end;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 20px 20px 40px;
      width: 100%;
      max-width: 600px;
      margin: 0 auto;
    }
    .modal-handle {
      width: 40px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 16px;
    }
    .modal h3 { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .form-group { margin-bottom: 14px; }
    .form-label {
      font-size: 12px;
      color: var(--text2);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      display: block;
    }
    .form-input, .form-select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 15px;
      padding: 10px 12px;
    }
    .form-input:focus, .form-select:focus {
      outline: none;
      border-color: var(--gold);
    }
    .form-select option { background: var(--surface2); }
    .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
    .btn-primary {
      flex: 1;
      background: var(--gold);
      color: #000;
      font-weight: 700;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      padding: 13px;
      cursor: pointer;
    }
    .btn-secondary {
      flex: 1;
      background: var(--surface2);
      color: var(--text);
      font-weight: 600;
      font-size: 15px;
      border: none;
      border-radius: 10px;
      padding: 13px;
      cursor: pointer;
    }

    /* ── EMPTY STATE ── */
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: var(--text2);
    }
    .empty-icon { font-size: 40px; margin-bottom: 12px; }
    .empty-text { font-size: 15px; }

    /* ── SEARCH ── */
    .search-wrap { position: relative; margin-bottom: 16px; }
    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 15px;
      padding: 10px 12px 10px 36px;
    }
    .search-input:focus { outline: none; border-color: var(--gold); }
    .search-icon {
      position: absolute;
      left: 11px; top: 50%;
      transform: translateY(-50%);
      color: var(--text3);
      font-size: 16px;
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 300;
      white-space: nowrap;
    }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>

<!-- LOCK SCREEN -->
<div id="lock-screen">
  <div class="lock-logo">🔨</div>
  <div class="lock-title">Northmen</div>
  <div class="lock-sub">Enter your PIN to continue</div>
  <div class="pin-dots">
    <div class="pin-dot" id="dot-0"></div>
    <div class="pin-dot" id="dot-1"></div>
    <div class="pin-dot" id="dot-2"></div>
    <div class="pin-dot" id="dot-3"></div>
  </div>
  <div class="pin-keypad">
    <button class="pin-key" onclick="pinPress('1')">1</button>
    <button class="pin-key" onclick="pinPress('2')">2</button>
    <button class="pin-key" onclick="pinPress('3')">3</button>
    <button class="pin-key" onclick="pinPress('4')">4</button>
    <button class="pin-key" onclick="pinPress('5')">5</button>
    <button class="pin-key" onclick="pinPress('6')">6</button>
    <button class="pin-key" onclick="pinPress('7')">7</button>
    <button class="pin-key" onclick="pinPress('8')">8</button>
    <button class="pin-key" onclick="pinPress('9')">9</button>
    <button class="pin-key empty"></button>
    <button class="pin-key" onclick="pinPress('0')">0</button>
    <button class="pin-key del" onclick="pinDelete()">⌫</button>
  </div>
  <div class="lock-error" id="lock-error"></div>
</div>

<!-- TOP BAR -->
<div class="topbar">
  <div class="topbar-inner">
    <div class="logo">
      <div class="logo-icon">🔨</div>
      <div>
        <div class="logo-text">Northmen</div>
        <div class="logo-sub">Inventory</div>
      </div>
    </div>
    <div class="mode-toggle">
      <button class="mode-btn active" onclick="setMode('employee')">Employee</button>
      <button class="mode-btn" onclick="setMode('owner')">Owner</button>
    </div>
  </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- ══════════════════════════════════════════════
     EMPLOYEE SCREENS
══════════════════════════════════════════════ -->

<!-- E1: Location Select -->
<div id="e-locations" class="screen active">
  <div class="inner">
    <div class="section-label">Select Location</div>
    <div class="location-grid" id="location-grid"></div>
  </div>
</div>

<!-- E2: Category List -->
<div id="e-categories" class="screen">
  <div class="inner">
    <button class="back-btn" onclick="goBack('e-locations')">‹ Locations</button>
    <div class="page-title" id="e-cat-title"></div>
    <div class="page-sub" id="e-cat-sub"></div>
    <div class="cat-list" id="e-cat-list"></div>
  </div>
</div>

<!-- E3: Item List -->
<div id="e-items" class="screen">
  <div class="inner">
    <button class="back-btn" id="e-items-back">‹ Categories</button>
    <div class="page-title" id="e-items-title"></div>
    <div class="page-sub" id="e-items-sub"></div>
    <div class="item-list" id="e-item-list"></div>
    <div style="height:80px"></div>
  </div>
  <button class="add-btn" onclick="openAddModal()" title="Add Item">+</button>
</div>

<!-- ══════════════════════════════════════════════
     OWNER SCREENS
══════════════════════════════════════════════ -->

<!-- O1: Owner Dashboard -->
<div id="o-dashboard" class="screen">
  <div class="inner">
    <!-- Reorder Banner -->
    <div class="reorder-banner" id="o-reorder-banner">
      <div class="reorder-banner-header">
        <span style="font-size:20px">🚨</span>
        <h2>REORDER NOW</h2>
        <span class="badge" id="o-reorder-count">0</span>
      </div>
      <div id="o-reorder-list"></div>
    </div>

    <!-- Browse Inventory -->
    <div class="section-label">Browse Inventory</div>
    <div class="location-grid" id="o-location-grid"></div>
  </div>
</div>

<!-- O2: Owner Category List -->
<div id="o-categories" class="screen">
  <div class="inner">
    <button class="back-btn" onclick="goBack('o-dashboard')">‹ Dashboard</button>
    <div class="page-title" id="o-cat-title"></div>
    <div class="page-sub" id="o-cat-sub"></div>
    <div class="cat-list" id="o-cat-list"></div>
  </div>
</div>

<!-- O3: Owner Item List -->
<div id="o-items" class="screen">
  <div class="inner">
    <button class="back-btn" id="o-items-back">‹ Categories</button>
    <div class="page-title" id="o-items-title"></div>
    <div class="page-sub" id="o-items-sub"></div>
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input class="search-input" type="search" placeholder="Search items…" oninput="filterOwnerItems(this.value)" />
    </div>
    <div class="item-list owner-browse" id="o-item-list"></div>
    <div style="height:40px"></div>
  </div>
</div>

<!-- EDIT QTY MODAL -->
<div class="modal-overlay" id="qty-modal">
  <div class="modal">
    <div class="modal-handle"></div>
    <h3 id="qty-modal-title">Edit Quantity</h3>
    <div class="form-group">
      <label class="form-label">Qty on Hand</label>

function getAllReorders() {
  const items = [];
  for (const [loc, cats] of Object.entries(DB)) {
    for (const [cat, itemArr] of Object.entries(cats)) {
      for (const item of itemArr) {
        if (item.reorder === 'Yes') {
          items.push({ ...item, location: loc, category: cat });
        }
      }
    }
  }
  return items;
}

function locationReorderCount(loc) {
  let count = 0;
  for (const [cat, items] of Object.entries(DB[loc])) {
    count += items.filter(i => i.reorder === 'Yes').length;
  }
  return count;
}

function categoryReorderCount(loc, cat) {
  return (DB[loc][cat] || []).filter(i => i.reorder === 'Yes').length;
}

function categoryItemCount(loc, cat) {
  return (DB[loc][cat] || []).length;
}

// Fraction step ladder — +/− cycles through these for box-based quantities
const FRACTION_STEPS = ['0', '1/4 Box', '1/2 Box', '3/4 Box', '1 Box', '1-1/4 Box', '1-1/2 Box', '1-3/4 Box', '2 Boxes', '2-1/2 Boxes', '3 Boxes'];
const FRACTION_STEPS_TUB = ['0', '1/4 Tub', '1/2 Tub', '3/4 Tub', '1 Tub', '1-1/4 Tub', '1-1/2 Tub', '2 Tubs'];
const FRACTION_STEPS_RACK = ['0', '1 Rack', '2 Racks', '3 Racks', '4 Racks', '5 Racks', '6 Racks', '7 Racks', '8 Racks', '9 Racks', '10 Racks'];

function getStepList(qty, unit) {
  const q = qty.toLowerCase();
  const u = (unit || '').toLowerCase();
  if (q.includes('tub') || u.includes('tub')) return FRACTION_STEPS_TUB;
  if (q.includes('rack') || u.includes('rack')) return FRACTION_STEPS_RACK;
  if (q.includes('box') || u.includes('box')) return FRACTION_STEPS;
  return null; // use numeric for pure numbers
}

function evalFraction(str) {
  // Evaluate strings like "3/4", "1-3/4", "1.5"
  str = str.trim();
  const mixed = str.match(/^(\d+)-(\d+)\/(\d+)$/);
  if (mixed) return parseInt(mixed[1]) + parseInt(mixed[2]) / parseInt(mixed[3]);
  const frac = str.match(/^(\d+)\/(\d+)$/);
  if (frac) return parseInt(frac[1]) / parseInt(frac[2]);
  return parseFloat(str);
}

function editQty(id, delta) {
  const item = findItem(id);
  if (!item) return;

  const steps = getStepList(item.qty, item.unit);
  if (steps) {
    // Step through the fraction ladder
    const current = item.qty.trim();
    let idx = steps.findIndex(s => s === current);
    if (idx === -1) {
      // Not in ladder — find closest
      const val = evalFraction(current.replace(/[^\d\-\/\.]/g, ''));
      idx = steps.length - 1;
      for (let i = 0; i < steps.length; i++) {
        const sv = evalFraction(steps[i].replace(/[^\d\-\/\.]/g, ''));
        if (!isNaN(val) && sv >= val) { idx = i; break; }
      }
    }
    idx = Math.max(0, Math.min(steps.length - 1, idx + delta));
    item.qty = steps[idx];
  } else {
    // Pure numeric
    let num = parseFloat(item.qty);
    if (isNaN(num)) num = 0;
    num = Math.max(0, num + delta);
    item.qty = String(num);
  }

  document.getElementById('qty-' + id).textContent = item.qty;
  saveData();
  toast('Quantity updated');
}

function editQtyText(id) {
  const item = findItem(id);
  if (!item) return;
  _qtyModalId = id;
  document.getElementById('qty-modal-title').textContent = item.name;
  document.getElementById('qty-modal-input').value = item.qty;
  document.getElementById('qty-modal').classList.add('open');
  setTimeout(() => document.getElementById('qty-modal-input').focus(), 100);
}

function setQtyPreset(val) {
  document.getElementById('qty-modal-input').value = val;
}

function closeQtyModal() {
  document.getElementById('qty-modal').classList.remove('open');
  _qtyModalId = null;
}

function saveQtyModal() {
  if (!_qtyModalId) return;
  const val = document.getElementById('qty-modal-input').value.trim();
  if (!val) { closeQtyModal(); return; }
  const item = findItem(_qtyModalId);
  if (item) {
    item.qty = val;
    document.getElementById('qty-' + _qtyModalId).textContent = val;
    saveData();
    toast('Quantity updated');
  }
  closeQtyModal();
}

function toggleReorder(id) {
  const item = findItem(id);
  if (!item) return;
  item.reorder = item.reorder === 'Yes' ? 'No' : 'Yes';
  const btn = document.getElementById('toggle-' + id);
  const txt = document.getElementById('toggle-text-' + id);
  const card = document.getElementById('card-' + id);
  if (item.reorder === 'Yes') {
    btn.classList.add('on');
    txt.textContent = 'YES';
    txt.style.color = 'var(--red)';
    card.classList.add('reorder-flagged');
    toast('🚨 Flagged for reorder — owner will be notified');
  } else {
    btn.classList.remove('on');
    txt.textContent = 'NO';
    txt.style.color = '';
    card.classList.remove('reorder-flagged');
    toast('Reorder flag cleared');
  }
  saveData();
  // Re-render location grid so badge counts update
  renderLocationGrid();
}

function findItem(id) {
  for (const loc of Object.values(DB)) {
    for (const items of Object.values(loc)) {
      const item = items.find(i => i.id === id);
      if (item) return item;
    }
  }
  return null;
}

// ══════════════════════════════════════════════
// ADD ITEM MODAL
// ══════════════════════════════════════════════
function openAddModal() {
  document.getElementById('add-modal').classList.add('open');
  document.getElementById('new-name').value = '';
  document.getElementById('new-detail').value = '';
  document.getElementById('new-unit').value = '';
  document.getElementById('new-qty').value = '';
  document.getElementById('new-reorder').value = 'No';
}

function closeAddModal() {
  document.getElementById('add-modal').classList.remove('open');
}

function saveNewItem() {
  const name = document.getElementById('new-name').value.trim();
  if (!name) { toast('Please enter an item name'); return; }
  const item = {
    id: uid(),
    name,
    detail: document.getElementById('new-detail').value.trim(),
    unit: document.getElementById('new-unit').value.trim() || 'ea',
    qty: document.getElementById('new-qty').value.trim() || '0',
    reorder: document.getElementById('new-reorder').value === 'Yes — notify owner' ? 'Yes' : document.getElementById('new-reorder').value
  };
  if (!DB[currentLocation][currentCategory]) DB[currentLocation][currentCategory] = [];
  DB[currentLocation][currentCategory].push(item);
  saveData();
  closeAddModal();
  renderItemList();
  renderLocationGrid();
  toast('Item added ✓');
}

// ══════════════════════════════════════════════
// OWNER: DASHBOARD
// ══════════════════════════════════════════════
function renderOwnerDashboard() {
  // Reorder banner
  const reorders = getAllReorders();
  document.getElementById('o-reorder-count').textContent = reorders.length;
  const list = document.getElementById('o-reorder-list');
  if (reorders.length === 0) {
    list.innerHTML = `<div style="color:var(--text2);font-size:14px;text-align:center;padding:8px 0">All clear — nothing needs to be reordered.</div>`;
  } else {
    list.innerHTML = reorders.map(item => `
      <div class="reorder-item" id="reorder-card-${item.id}">
        <div class="reorder-item-name">${item.name}</div>
        <div class="reorder-item-meta">${item.detail || ''} · On hand: ${item.qty} ${item.unit}</div>
        <div class="reorder-item-location">📍 ${item.location} — ${item.category}</div>
        <div class="reorder-item-footer">
          <button class="done-btn" onclick="openOrderedModal('${item.id}')">✓ Done — Mark as Ordered</button>
        </div>
      </div>`).join('');
  }

  // Location grid
  const grid = document.getElementById('o-location-grid');
  const icons = { 'Job Site': '🏗️', 'Trailer': '🚛' };
  grid.innerHTML = Object.keys(DB).map(loc => {
    const reorderCount = locationReorderCount(loc);
    const totalItems = Object.values(DB[loc]).reduce((s, arr) => s + arr.length, 0);
    return `
      <div class="location-card ${reorderCount > 0 ? 'has-reorder' : ''}" onclick="openOwnerLocation('${loc}')">
        <div class="loc-icon">${icons[loc] || '📦'}</div>
        <div class="loc-name">${loc}</div>
        <div class="loc-count">${totalItems} items</div>
        ${reorderCount > 0 ? `<div class="loc-alert">${reorderCount} reorder${reorderCount > 1 ? 's' : ''}</div>` : ''}
      </div>`;
  }).join('');
}

function openOwnerLocation(loc) {
  currentLocation = loc;
  document.getElementById('o-cat-title').textContent = loc;
  document.getElementById('o-cat-sub').textContent = `${Object.keys(DB[loc]).length} categories`;
  renderOwnerCategoryList();
  showScreen('o-categories');
}

function renderOwnerCategoryList() {
  const list = document.getElementById('o-cat-list');
  list.innerHTML = Object.keys(DB[currentLocation]).map(cat => {
    const reorders = categoryReorderCount(currentLocation, cat);
    const count = categoryItemCount(currentLocation, cat);
    const icon = CATEGORY_ICONS[cat] || '📦';
    return `
      <div class="cat-card" onclick="openCategory('${cat}', 'owner')">
        <div class="cat-card-left">
          <div class="cat-icon">${icon}</div>
          <div>
            <div class="cat-name">${cat}</div>
            <div class="cat-count">${count} item${count !== 1 ? 's' : ''}</div>
          </div>
        </div>
        <div class="cat-right">
          ${reorders > 0 ? `<span class="cat-reorder-badge">${reorders}</span>` : ''}
          <span class="chevron">›</span>
        </div>
      </div>`;
  }).join('');
}

function renderOwnerItemList(filter) {
  const list = document.getElementById('o-item-list');
  let items = DB[currentLocation][currentCategory] || [];
  if (filter) {
    const q = filter.toLowerCase();
    items = items.filter(i =>
      i.name.toLowerCase().includes(q) ||
      (i.detail || '').toLowerCase().includes(q)
    );
  }
  if (items.length === 0) {
    list.innerHTML = `<div class="empty"><div class="empty-icon">📭</div><div class="empty-text">${filter ? 'No matching items.' : 'No items in this category yet.'}</div></div>`;
    return;
  }
  list.innerHTML = items.map(item => `
    <div class="item-card ${item.reorder === 'Yes' ? 'reorder-flagged' : ''}">
      <div class="item-header">
        <div class="item-name">${item.name}</div>
        ${item.detail ? `<div class="item-detail">${item.detail}</div>` : ''}
      </div>
      <div class="item-qty-readonly">
        <div>
          <div class="qty-label-ro">Qty on Hand</div>
          <div class="qty-val-ro">${item.qty} <span style="font-size:12px;color:var(--text2)">${item.unit}</span></div>
        </div>
        <span class="reorder-chip ${item.reorder === 'Yes' ? '' : 'no'}">${item.reorder === 'Yes' ? '🚨 REORDER' : 'OK'}</span>
      </div>
    </div>`).join('');
}

function filterOwnerItems(val) {
  renderOwnerItemList(val);
}

// ══════════════════════════════════════════════
// TOAST
// ══════════════════════════════════════════════
let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

// ══════════════════════════════════════════════
// ORDERED MODAL
// ══════════════════════════════════════════════
let _orderedItemId = null;

function openOrderedModal(id) {
  const item = findItem(id);
  if (!item) return;
  _orderedItemId = id;
  document.getElementById('ordered-item-label').textContent = `${item.name}${item.detail ? ' — ' + item.detail : ''}`;
  document.getElementById('ordered-qty-input').value = item.unit || '';
  document.getElementById('ordered-modal').classList.add('open');
  setTimeout(() => document.getElementById('ordered-qty-input').focus(), 100);
}

function setOrderedPreset(val) {
  document.getElementById('ordered-qty-input').value = val;
}

function closeOrderedModal() {
  document.getElementById('ordered-modal').classList.remove('open');
  _orderedItemId = null;
}

function saveOrdered() {
  if (!_orderedItemId) return;
  const qtyOrdered = document.getElementById('ordered-qty-input').value.trim();
  const item = findItem(_orderedItemId);
  if (item) {
    // Clear the reorder flag and update qty to what was ordered
    item.reorder = 'No';
    if (qtyOrdered) item.qty = qtyOrdered;
    saveData();
    // Remove the card from the reorder list smoothly
    const card = document.getElementById('reorder-card-' + _orderedItemId);
    if (card) {
      card.style.transition = 'opacity 0.3s, transform 0.3s';
      card.style.opacity = '0';
      card.style.transform = 'translateX(30px)';
      setTimeout(() => renderOwnerDashboard(), 350);
    } else {
      renderOwnerDashboard();
    }
    toast('✅ Marked as ordered — reorder flag cleared');
  }
  closeOrderedModal();
}

// ══════════════════════════════════════════════
// PIN LOCK
// ══════════════════════════════════════════════
const CORRECT_PIN = '2319';
const SESSION_KEY = 'northmen_unlocked';
let pinEntry = '';

function pinPress(digit) {
  if (pinEntry.length >= 4) return;
  pinEntry += digit;
  updateDots();
  if (pinEntry.length === 4) {
    setTimeout(checkPin, 120);
  }
}

function pinDelete() {
  pinEntry = pinEntry.slice(0, -1);
  updateDots();
  document.getElementById('lock-error').textContent = '';
}

function updateDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('dot-' + i);
    dot.classList.toggle('filled', i < pinEntry.length);
    dot.classList.remove('error');
  }
}

function checkPin() {
  if (pinEntry === CORRECT_PIN) {
    sessionStorage.setItem(SESSION_KEY, '1');
    document.getElementById('lock-screen').classList.add('hidden');
    renderLocationGrid();
  } else {
    // Shake dots red, then reset
    for (let i = 0; i < 4; i++) {
      const dot = document.getElementById('dot-' + i);
      dot.classList.add('error');
      dot.classList.remove('filled');
    }
    document.getElementById('lock-error').textContent = 'Incorrect PIN. Try again.';
    pinEntry = '';
    setTimeout(updateDots, 600);
  }
}

// ══════════════════════════════════════════════
// INIT
// ══════════════════════════════════════════════
if (sessionStorage.getItem(SESSION_KEY) === '1') {
  // Already unlocked this session
  document.getElementById('lock-screen').classList.add('hidden');
  renderLocationGrid();
}
// else: lock screen is shown by default, renderLocationGrid runs after correct PIN
</script>
